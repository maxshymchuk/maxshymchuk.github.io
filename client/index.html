<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="<%= it.meta.description %>" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="<%= it.meta.title %>" />
        <meta property="og:description" content="<%= it.meta.description %>" />
        <meta property="og:url" content="<%= it.meta.root %>" />
        <meta property="og:image" content="<%= it.meta.root %>/preview.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:type" content="image/png" />
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#212830" media="(prefers-color-scheme: dark)" />
        <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="32x32 64x64 128x128 256x256 512x512" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preload"
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            as="style"
        />
        <link rel="preload" href="src/styles/index.scss" as="style" />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link href="src/styles/index.scss" rel="stylesheet" />
        <script type="module" defer src="src/index.ts"></script>
        <title><%= it.meta.title %></title>
        <style>
            :root {
                color-scheme: light dark;

                --default-background-color: #ffffff;
                --default-color: #1f2328;

                --default-background-color-dark: #212830;
                --default-color-dark: #d1d7e0;

                --default-font-size: 16px;
            }
            html,
            body {
                background-color: var(--default-background-color);
                color: var(--default-color);
                min-height: 100vh;
                font-size: var(--default-font-size);
                -webkit-text-size-adjust: none;
                text-size-adjust: none;
                font-family: 'Montserrat', sans-serif;
                margin: 0;
                font-size: 1rem;
                transition: background-color 0.5s;
            }
            @media (prefers-color-scheme: dark) {
                html,
                body {
                    background-color: var(--default-background-color-dark);
                    color: var(--default-color-dark);
                }
            }
        </style>
    </head>
    <body>
        <%~ include("./src/templates/index.eta", it.data) %>
    </body>
</html>
